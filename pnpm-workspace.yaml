packages:
  - "apps/*"
  - "packages/*"

# pnpm 11+: explicit allowlist for native postinstall scripts.
# Setting `true` runs the script (needed for native binaries like sharp/swc).
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  sharp: true
  unrs-resolver: true
